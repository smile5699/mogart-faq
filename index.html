<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摩岛 · 客服知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f8fa;--card:#fff;--text:#1a1a2e;--sub:#6b7280;--accent:#C19C4F;
  --accent-light:#faf3e0;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --radius:10px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* 顶部品牌栏 */
.navbar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.navbar-inner{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .logo{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.brand .name{font-size:17px;font-weight:700;color:var(--text)}
.brand .sub{font-size:12px;color:var(--sub);font-weight:400}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links .nav-btn{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.nav-btn.active{background:var(--accent);color:#fff}
.nav-btn.dim{background:transparent;color:var(--sub);border:1px solid transparent}
.nav-btn.dim:hover{background:#f3f4f6;color:var(--text)}
.nav-btn.highlight{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent);font-weight:600}
.nav-btn.highlight:hover{background:var(--accent);color:#fff}

.container{max-width:800px;margin:0 auto;padding:24px 20px}

/* 搜索 */
.search-wrap{margin-bottom:24px}
.search-wrap input{width:100%;padding:14px 48px 14px 20px;font-size:15px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;outline:none;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,72,46,.1)}
.search-wrap{position:relative}
.search-wrap .icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:16px;pointer-events:none}
.stats{font-size:13px;color:var(--sub);margin-bottom:16px}

/* 卡片 */
.faq-list{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .15s}
.card:hover{border-color:#d1d5db}
.card .q{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px;color:var(--text)}
.card .q .qi{color:var(--accent);font-weight:700;flex-shrink:0}

.card .note{font-size:13px;color:var(--accent);background:var(--accent-light);padding:8px 12px;border-radius:6px;margin-bottom:10px;line-height:1.6}

.reply-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.reply-step .step-num{flex-shrink:0;width:44px;text-align:center;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-light);border-radius:6px;padding:3px 0;line-height:1.3}
.reply-step .step-text{flex:1;font-size:14px;color:var(--sub);line-height:1.8;white-space:pre-wrap}

.faq-images{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.faq-images img{max-width:180px;max-height:180px;border-radius:8px;border:1px solid var(--border);cursor:pointer;object-fit:cover}

.card .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.card .tag{font-size:11px;padding:2px 8px;border-radius:4px;background:#f3f4f6;color:var(--sub)}
.card .copy-btn{font-size:12px;color:var(--accent);cursor:pointer;border:none;background:none;margin-left:auto;font-weight:500}
.card .copy-btn:hover{text-decoration:underline}

mark{background:#fef3c7;color:var(--text);padding:0 2px;border-radius:2px}

.no-result{text-align:center;padding:60px 20px;color:var(--sub)}
.no-result svg{width:56px;height:56px;opacity:.25;margin-bottom:14px}

/* 管理面板 */
.admin-panel{display:none;background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px}
.admin-panel.on{display:block}
.admin-panel h3{font-size:16px;margin-bottom:16px}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row input,.form-row textarea,.form-row select{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--accent)}
.form-row textarea{resize:vertical;min-height:60px}

.admin-reply-step{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.admin-reply-step .sl{font-size:13px;font-weight:600;color:var(--accent);padding-top:10px;min-width:48px;text-align:center}
.admin-reply-step textarea{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:42px;outline:none;background:#fff}
.admin-reply-step textarea:focus{border-color:var(--accent)}

.image-upload-area{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--sub);font-size:14px;margin-bottom:10px;transition:all .15s}
.image-upload-area:hover{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.image-upload-area input{display:none}

.admin-list{margin-top:16px;max-height:400px;overflow-y:auto}
.admin-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);gap:10px;font-size:13px}
.admin-item:hover{background:var(--bg)}
.admin-item .ai-l{flex:1;min-width:0}
.admin-item .ai-q{font-weight:500;font-size:13px}
.admin-item .ai-s{font-size:12px;color:var(--sub);margin-top:2px}
.admin-item .ai-a{display:flex;gap:4px;flex-shrink:0}

.image-preview-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.image-preview-item{position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.image-preview-item img{width:100%;height:100%;object-fit:cover}
.image-preview-item .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:12px}
.image-count{font-size:12px;color:var(--sub);margin-bottom:6px}

.actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--sub);margin-top:10px}

.btn{padding:7px 15px;border:none;border-radius:7px;font-size:13px;cursor:pointer;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:5px}
.btn-red{background:var(--accent);color:#fff}
.btn-red:hover{opacity:.9}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--bg)}
.btn-xs{padding:4px 10px;font-size:12px}

.lightbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;cursor:pointer}
.lightbox.on{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:10px}
.lightbox .close{position:absolute;top:20px;right:20px;color:#fff;font-size:32px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);border-radius:50%}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:1999;animation:fi .2s;pointer-events:none}
@keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:600px){
  .container{padding:16px 12px}
  .navbar-inner{padding:10px 14px}
  .brand .name{font-size:15px}
  .card{padding:14px 16px}
}

/* 首页缺省 */
.welcome{text-align:center;padding:40px 20px}
.welcome .wl{font-size:48px;margin-bottom:8px}
.welcome h2{font-size:18px;color:var(--text);margin-bottom:6px}
.welcome p{font-size:14px;color:var(--sub);margin-bottom:20px}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <img src="mogart-logo.jpg" alt="Mogart" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--border)">
      <div>
        <div class="name">摩岛 · 客服知识库</div>
        <div class="sub">Mogart Customer Service Hub</div>
      </div>
    </div>
    <div class="nav-links">
      <a href="product-lookup.html" class="nav-btn highlight">📦 查配料表</a>
      <button class="nav-btn dim" onclick="exportAll()">📥 合并导出</button>
      <button class="nav-btn dim" onclick="document.getElementById('importFile').click()">📤 合并导入</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="nav-btn dim" onclick="toggleAdmin()">⚙ 管理</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="admin-panel" id="adminPanel">
    <h3 id="adminTitle">添加 FAQ</h3>
    <div class="form-row">
      <input type="text" id="faqQ" placeholder="问题（如：豆浆粉怎么冲泡？）">
      <select id="faqCat"><option value="">分类（可选）</option>
        <option value="产品相关">产品相关</option><option value="物流配送">物流配送</option>
        <option value="退换货">退换货</option><option value="订单问题">订单问题</option>
        <option value="支付问题">支付问题</option><option value="售后维权">售后维权</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-row"><textarea id="faqNote" placeholder="操作备注（可选）：告诉客服怎么操作，如「第一步确认情况，第二步给方案」" style="min-height:46px;font-size:13px"></textarea></div>
    <div id="replySteps">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px">📨 回复话术步骤</label>
    </div>
    <button class="btn btn-ghost btn-xs" onclick="addReplyStep()" style="margin-bottom:10px">+ 添加回复步骤</button>
    <div class="hint" style="margin-bottom:10px">💡 多步骤 = 客服按顺序分次发送</div>

    <div class="image-upload-area" onclick="document.getElementById('imgInput').click()"
      ondragover="event.preventDefault();this.classList.add('hover')" ondragleave="e=>e.target.classList.remove('hover')"
      ondrop="handleDrop(event)">
      <p>📷 点击 / 拖拽 / Ctrl+V 上传图片（可多张）</p>
      <input type="file" id="imgInput" accept="image/*" multiple onchange="handleImageSelect(event)">
    </div>
    <div class="image-count" id="imgCount"></div><div class="image-preview-list" id="imgPreview"></div>
    <input type="hidden" id="faqEditIdx" value="-1">
    <button class="btn btn-red" onclick="saveFaq()">💾 保存</button>
    <button class="btn btn-ghost" onclick="cancelEdit()" style="margin-left:8px">取消</button>

    <div class="admin-list" id="adminList"></div>
    <div class="actions">
      <button class="btn btn-ghost btn-xs" onclick="exportData()">📥 导出备份</button>
      <span style="font-size:12px;color:var(--sub)">共 <span id="faqCount">0</span> 条</span>
    </div>
    <div class="hint">💡 更新话术：你导出 JSON → 发客服 → 客服点右上角「📤 导入」→ 选文件即可</div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍  输入问题关键词，如：退换货、快递、冲泡..." oninput="doSearch()" autofocus>
  </div>
  <div class="stats" id="searchStats"></div>
  <div class="faq-list" id="faqList"></div>
</div>

<script>
const STORAGE_KEY = 'faq_kb';
const BUILTIN_DATA = [
  {q:"豆浆粉怎么冲泡？",a:["每包豆浆粉配 200ml 温水（60-80℃最佳），先倒水再倒粉，搅拌均匀即可饮用。冷水也能冲开但口感略差。"],note:"先确认客户买的是哪款（黄豆浆/黑豆浆/无蔗糖），再发冲泡方法",cat:"产品相关"},
  {q:"无蔗糖豆浆粉适合什么人喝？",a:["适合控糖人群、孕妇、老人、健身人士。无添加蔗糖，甜味来自大豆本身。"],cat:"产品相关"},
  {q:"发货时间是什么时候？",a:["每天 16:00 前付款的订单当天发出，16:00 后的订单次日发出。节假日顺延。"],note:"先查订单状态，确认是否已发出",cat:"物流配送"},
  {q:"怎么申请退换货？",a:["亲，请问是什么问题呢？方便拍张照片看看吗？","好的收到，经确认属于质量问题，给您安排退换。请从订单里申请退货退款，收到货后立即处理。"],note:"第一步：确认问题+要照片；第二步：确认后告知退换流程",cat:"退换货"},
  {q:"收到货少发/错发了？",a:["亲，请把收到的所有商品和快递面单一起拍照发我们，马上核实。"],cat:"订单问题"},
  {q:"豆浆粉适合小孩喝吗？",a:["建议 3 岁以上儿童饮用，我们的豆浆粉无添加蔗糖，安全健康。"],cat:"产品相关"}
];

let faqData = [];
(function init(){
  try {
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) { faqData = JSON.parse(cached); faqData.forEach(item => { if(typeof item.a==='string') item.a=[item.a]; if(!item.a||!item.a.length) item.a=['']; }); }
  } catch(e) {}
  if (!faqData||!faqData.length) { faqData = [...BUILTIN_DATA]; localStorage.setItem(STORAGE_KEY, JSON.stringify(faqData)); }
  renderAllCards(faqData);
  document.getElementById('searchStats').textContent = `共 ${faqData.length} 条常见问题`;
  document.getElementById('faqCount').textContent = faqData.length;
  document.getElementById('searchInput').focus();
})();

function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(faqData)); document.getElementById('faqCount').textContent = faqData.length; }

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) { document.getElementById('searchStats').textContent = `共 ${faqData.length} 条常见问题`; renderAllCards(faqData); return; }
  const kw = q.split(/\s+/).filter(k=>k);
  const results = faqData.filter(item => {
    const steps = Array.isArray(item.a) ? item.a.join(' ') : (item.a||'');
    return kw.every(k => (item.q+' '+steps+' '+(item.note||'')+' '+(item.cat||'')).toLowerCase().includes(k));
  });
  document.getElementById('searchStats').textContent = `找到 ${results.length} 条（共 ${faqData.length} 条）`;
  if (!results.length) { document.getElementById('faqList').innerHTML = '<div class="no-result"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><circle cx="28" cy="28" r="20"/><line x1="42" y1="42" x2="56" y2="56"/></svg><p>没有找到相关问题</p><p style="font-size:13px;color:#aaa;margin-top:4px">试试其他关键词</p></div>'; return; }
  renderAllCards(results, kw);
}

function hl(text, kw) {
  if (!kw||!kw.length) return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  kw.forEach(k => html = html.replace(new RegExp(`(${k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'), '<mark>$1</mark>'));
  return html;
}

function renderReplySteps(item, kw) {
  const steps = Array.isArray(item.a) ? item.a : [item.a||''];
  return steps.map((s,i) => `<div class="reply-step"><div class="step-num">第<br>${i+1}<br>步</div><div class="step-text">${hl(s, kw)}</div></div>`).join('');
}

function renderAllCards(items, kw) {
  document.getElementById('faqList').innerHTML = items.map(item => `
    <div class="card">
      <div class="q"><span class="qi">Q</span>${hl(item.q, kw)}</div>
      ${item.note ? `<div class="note">💡 ${hl(item.note, kw)}</div>` : ''}
      ${renderReplySteps(item, kw)}
      ${(item.images||[]).length ? `<div class="faq-images">${item.images.map(img => `<img src="${img}" onclick="openLightbox(this.src)" loading="lazy">`).join('')}</div>` : ''}
      <div class="meta">
        ${item.cat ? `<span class="tag">${item.cat}</span>` : ''}
        ${(item.images||[]).length ? `<span class="tag">📷 ${item.images.length}张</span>` : ''}
        <button class="copy-btn" onclick="copyFaq(${faqData.indexOf(item)})">📋 复制话术</button>
      </div>
    </div>`).join('');
}

async function copyFaq(idx) {
  const item = faqData[idx];
  const steps = Array.isArray(item.a) ? item.a : [item.a||''];
  const imgs = item.images||[];
  const text = (item.note ? '💡 '+item.note+'\n\n' : '') + (steps.length>1 ? steps.map((s,i)=>`【第${i+1}步 — 等买家回复后再发下一步】\n${s}`).join('\n\n') : steps[0]);

  if (!imgs.length) { navigator.clipboard.writeText(text).then(()=>showToast('已复制')); return; }
  try {
    const noteH = item.note ? `<div style="background:#fef2f0;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:13px;color:#e8482e">💡 ${item.note.replace(/\n/g,'<br>')}</div>` : '';
    const stepsH = steps.map((s,i)=>`<div style="margin-bottom:8px"><b style="font-size:12px;color:#e8482e">📨 第${i+1}步</b><br>${s.replace(/\n/g,'<br>')}</div>`).join('');
    const imgsH = imgs.map(img=>`<div><img src="${img}" style="max-width:400px;margin-top:8px;border-radius:6px"></div>`).join('');
    const blob = new Blob([noteH+stepsH+imgsH],{type:'text/html'});
    await navigator.clipboard.write([new ClipboardItem({'text/html':blob,'text/plain':new Blob([text],{type:'text/plain'})})]);
    showToast('✅ 已复制');
  } catch(e) { navigator.clipboard.writeText(text).catch(()=>{}); showToast('已复制（纯文字）'); }
}

// ========== 管理 ==========
let replySteps=['']; let pendingImages=[];

function toggleAdmin() { document.getElementById('adminPanel').classList.toggle('on'); if (document.getElementById('adminPanel').classList.contains('on')) renderAdminList(); }
function renderAdminList() {
  const el = document.getElementById('adminList');
  if (!faqData.length) { el.innerHTML = '<p style="color:#aaa;padding:20px;text-align:center">暂无条目</p>'; return; }
  el.innerHTML = faqData.map((item,i)=>`
    <div class="admin-item"><div class="ai-l">
      <div class="ai-q">${item.q}</div>
      <div class="ai-s">${(Array.isArray(item.a)?item.a:[item.a]).filter(Boolean).length}步 · ${item.cat||'未分类'}${item.note?' · 有备注':''}${(item.images||[]).length?' · 📷'+item.images.length+'张':''}</div>
    </div><div class="ai-a">
      <button class="btn btn-ghost btn-xs" onclick="moveFaq(${i},-1)" ${i===0?'disabled':''}>▲</button>
      <button class="btn btn-ghost btn-xs" onclick="moveFaq(${i},1)" ${i===faqData.length-1?'disabled':''}>▼</button>
      <button class="btn btn-ghost btn-xs" onclick="editFaq(${i})">✏</button>
      <button class="btn btn-ghost btn-xs" onclick="deleteFaq(${i})" style="color:var(--accent)">🗑</button>
    </div></div>`).join('');
}

function addReplyStep() { replySteps.push(''); renderReplyInputs(); }
function removeReplyStep(i) { if (replySteps.length<=1) { showToast('至少一个步骤'); return; } replySteps.splice(i,1); renderReplyInputs(); }
function renderReplyInputs() {
  document.getElementById('replySteps').innerHTML = '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px">📨 回复话术步骤</label>' +
    replySteps.map((s,i)=>`<div class="admin-reply-step"><span class="sl">第${i+1}步</span><textarea placeholder="第${i+1}句话术..." oninput="replySteps[${i}]=this.value">${s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea><button class="btn btn-ghost btn-xs" onclick="removeReplyStep(${i})" style="color:var(--accent)">✕</button></div>`).join('');
}

function handleImageSelect(e) { processFiles(Array.from(e.target.files)); e.target.value=''; }
function handleDrop(e) { e.preventDefault(); processFiles(Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'))); }
function processFiles(files) {
  files.forEach(f=>{ if(f.size>5*1024*1024){showToast('图片不能超5MB');return;}
    const r=new FileReader(); r.onload=ev=>{pendingImages.push(ev.target.result);renderImgPrev();}; r.readAsDataURL(f); });
}
function renderImgPrev() { document.getElementById('imgCount').textContent = pendingImages.length ? `已添加 ${pendingImages.length} 张` : '';
  document.getElementById('imgPreview').innerHTML = pendingImages.map((img,i)=>`<div class="image-preview-item"><img src="${img}"><button class="rm" onclick="pendingImages.splice(${i},1);renderImgPrev()">&times;</button></div>`).join(''); }

function saveFaq() {
  const q = document.getElementById('faqQ').value.trim(), note=document.getElementById('faqNote').value.trim(), cat=document.getElementById('faqCat').value;
  const idx = parseInt(document.getElementById('faqEditIdx').value), steps = replySteps.map(s=>s.trim()).filter(s=>s);
  if (!q) { showToast('问题不能为空'); return; } if (!steps.length) { showToast('至少一个回复步骤'); return; }
  const entry = {q, a:steps, cat}; if (note) entry.note=note; if (pendingImages.length) entry.images=[...pendingImages];
  if (idx>=0) faqData[idx]=entry; else faqData.push(entry);
  persist(); cancelEdit(); renderAdminList(); doSearch(); showToast(idx>=0?'已更新':'已添加');
}
function editFaq(idx) {
  const item=faqData[idx]; document.getElementById('faqQ').value=item.q; document.getElementById('faqNote').value=item.note||'';
  document.getElementById('faqCat').value=item.cat||''; document.getElementById('faqEditIdx').value=idx;
  replySteps=Array.isArray(item.a)?[...item.a]:[item.a||'']; if(!replySteps.length)replySteps=[''];
  pendingImages=[...(item.images||[])]; renderReplyInputs(); renderImgPrev(); document.getElementById('adminTitle').textContent='编辑 FAQ';
}
function cancelEdit() {
  document.getElementById('faqQ').value=''; document.getElementById('faqNote').value=''; document.getElementById('faqCat').value='';
  document.getElementById('faqEditIdx').value='-1'; replySteps=['']; pendingImages=[]; renderReplyInputs(); renderImgPrev();
  document.getElementById('adminTitle').textContent='添加 FAQ';
}
function deleteFaq(idx) { if(!confirm(`删除「${faqData[idx].q}」？`))return; faqData.splice(idx,1); persist(); renderAdminList(); doSearch(); showToast('已删除'); }

function moveFaq(idx, dir) {
  const target = idx + dir;
  if (target < 0 || target >= faqData.length) return;
  [faqData[idx], faqData[target]] = [faqData[target], faqData[idx]];
  persist(); renderAdminList(); doSearch();
}

function exportAll() {
  const products = JSON.parse(localStorage.getItem('product_id_db_v2') || '[]');
  const all = {
    exported: new Date().toISOString().slice(0,19),
    faq: faqData,
    products: products
  };
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(all,null,2)],{type:'application/json'}));
  a.download='摩岛知识库_全部_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  showToast(`已导出：${faqData.length}条FAQ + ${products.length}款产品`);
}

function exportData() {
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(faqData,null,2)],{type:'application/json'}));
  a.download='摩岛客服话术_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  showToast('已导出 FAQ');
}

function importData(e) {
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=ev=>{
    try {
      const d = JSON.parse(ev.target.result);
      let faq=[], products=null;
      if (d.faq) { faq = d.faq; products = d.products; }
      else if (Array.isArray(d)) { faq = d; }
      else { throw new Error(''); }

      faq.forEach(item=>{ if(typeof item.a==='string') item.a=[item.a]; });
      const msg = `导入 ${faq.length} 条FAQ` + (products ? ` + ${products.length} 款产品配料表` : '') + '（覆盖现有），确定吗？';
      if (!confirm(msg)) return;

      faqData = faq; persist();
      if (products) { localStorage.setItem('product_id_db_v2', JSON.stringify(products)); }
      renderAdminList(); doSearch();
      showToast('✅ 已导入：' + faq.length + '条FAQ' + (products ? ' + '+products.length+'款产品' : ''));
    } catch(err) { showToast('格式错误，请选择导出的 .json 文件'); }
  };
  r.readAsText(f); e.target.value='';
}

function openLightbox(src) {
  let lb=document.getElementById('lightbox'); if(!lb){lb=document.createElement('div');lb.id='lightbox';lb.className='lightbox';
    lb.innerHTML='<span class="close">&times;</span><img>';lb.onclick=function(e){if(e.target===lb||e.target.className==='close')lb.classList.remove('on')};document.body.appendChild(lb);}
  lb.querySelector('img').src=src; lb.classList.add('on');
}
document.addEventListener('paste', function(e) {
  if (!document.getElementById('adminPanel').classList.contains('on')) return;
  const files=[]; for(let i=0;i<e.clipboardData.items.length;i++){if(e.clipboardData.items[i].type.startsWith('image/'))files.push(e.clipboardData.items[i].getAsFile());}
  if(files.length){e.preventDefault();processFiles(files);showToast('已粘贴 '+files.length+' 张');}
});
function showToast(msg) { const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000); }
</script>
</body>
</html>
